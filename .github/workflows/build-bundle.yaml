name: Build Android App Bundle

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  native:
    name: Native libraries
    uses: ./.github/workflows/native-libs.yaml

  bundle:
    name: Build release AAB
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      aab_url: ${{ steps.upload.outputs.artifact-url }}
      abis: ${{ steps.android.outputs.abis }}
      min_sdk: ${{ steps.android.outputs.min_sdk }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_subject: ${{ steps.commit.outputs.subject }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read commit
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Android NDK
        id: android
        uses: ./.github/actions/setup-android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Go library
        uses: actions/download-artifact@v7
        with:
          name: native-go
          path: android/data/libs

      - name: Download Zig library
        uses: actions/download-artifact@v7
        with:
          name: native-zig
          path: android/app/src/main/jniLibs

      - name: Verify native libraries
        run: make verify-jni

      - name: Build release AAB
        run: android/gradlew -p android bundleRelease

      - name: Export licence report
        run: make licenses

      - name: Upload licence report
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-licenses
          path: legal/compliance
          retention-days: 90
          if-no-files-found: error

      - name: Upload release AAB
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
          if-no-files-found: error

  apks:
    name: Build installable APKs
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      universal_url: ${{ steps.upload-universal.outputs.artifact-url }}
      per_abi_url: ${{ steps.upload-per-abi.outputs.artifact-url }}

    steps:
      - name: Checkout signing key
        uses: actions/checkout@v7
        with:
          sparse-checkout: android/app/debug.keystore
          sparse-checkout-cone-mode: false

      - name: Download release AAB
        uses: actions/download-artifact@v7
        with:
          name: kubenexus-release-aab
          path: aab

      - name: Cache bundletool
        id: cache-bundletool
        uses: actions/cache@v5
        with:
          path: ~/bundletool.jar
          key: bundletool-${{ env.BUNDLETOOL_VERSION }}

      - name: Download bundletool
        if: steps.cache-bundletool.outputs.cache-hit != 'true'
        run: |
          curl -sSL --retry 3 -o ~/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      - name: Check bundletool
        run: echo "${BUNDLETOOL_SHA256}  $HOME/bundletool.jar" | sha256sum --check

      - name: Generate APKs
        env:
          ABIS: ${{ needs.bundle.outputs.abis }}
          MIN_SDK: ${{ needs.bundle.outputs.min_sdk }}
        run: |
          set -euo pipefail

          AAB=aab/app-release.aab
          OUT="$RUNNER_TEMP/apks"
          mkdir -p dist "$OUT"

          build_apks() {
            local name=$1 log
            shift
            if ! log=$(java -jar ~/bundletool.jar build-apks --bundle="$AAB" --output="$OUT/$name.apks" \
                --overwrite --ks=android/app/debug.keystore --ks-key-alias=androiddebugkey \
                --ks-pass=pass:android --key-pass=pass:android "$@" 2>&1); then
              echo "$log"
              return 1
            fi
            if grep -q "won't be signed" <<<"$log"; then
              echo "$log"
              echo "::error::bundletool produced unsigned APKs for $name"
              return 1
            fi
          }

          pids=()
          build_apks universal --mode=universal & pids+=($!)
          for abi in $ABIS; do
            printf '{"supportedAbis":["%s"],"screenDensity":480,"sdkVersion":%s,"supportedLocales":["en"]}\n' \
              "$abi" "$MIN_SDK" > "$OUT/$abi.json"
            build_apks "$abi" --device-spec="$OUT/$abi.json" --optimize-for=abi & pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

          unzip -q -p "$OUT/universal.apks" universal.apk > dist/kubenexus-universal.apk
          for abi in $ABIS; do
            unzip -q "$OUT/$abi.apks" 'splits/*' -d "$OUT/$abi"
            (cd "$OUT/$abi/splits" && zip -q -r "$GITHUB_WORKSPACE/dist/kubenexus-$abi-apks.zip" .)
          done

          ls -la dist

      - name: Upload universal APK
        id: upload-universal
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-universal-apk
          path: dist/kubenexus-universal.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload per-ABI APKs
        id: upload-per-abi
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-per-abi-apks
          path: dist/kubenexus-*-apks.zip
          retention-days: 1
          if-no-files-found: error

  notify:
    name: Send links to Telegram
    needs: [bundle, apks]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send artifact links to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          AAB_URL: ${{ needs.bundle.outputs.aab_url }}
          UNIVERSAL_URL: ${{ needs.apks.outputs.universal_url }}
          PER_ABI_URL: ${{ needs.apks.outputs.per_abi_url }}
          ABIS: ${{ needs.bundle.outputs.abis }}
          COMMIT_SHA: ${{ needs.bundle.outputs.commit_sha }}
          COMMIT_SUBJECT: ${{ needs.bundle.outputs.commit_subject }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set. Skipping Telegram notification."
            exit 0
          fi

          escape() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' <<<"$1"; }

          TEXT="<b>KubeNexus Build Completed</b>"$'\n\n'
          TEXT+="<b>Artifacts:</b>"$'\n'
          TEXT+="- <a href=\"${UNIVERSAL_URL:-$RUN_URL}\">kubenexus-universal-apk</a> <i>(install on any device)</i>"$'\n'
          TEXT+="- <a href=\"${PER_ABI_URL:-$RUN_URL}\">kubenexus-per-abi-apks</a> <i>(${ABIS// / \/ })</i>"$'\n'
          TEXT+="- <a href=\"${AAB_URL:-$RUN_URL}\">kubenexus-release-aab</a> <i>(for Play)</i>"$'\n\n'
          TEXT+="<b>Build Details:</b>"$'\n'
          TEXT+="- <b>Branch:</b> <code>$(escape "$BRANCH")</code>"$'\n'
          TEXT+="- <b>Commit:</b> <code>${COMMIT_SHA}</code> - $(escape "$COMMIT_SUBJECT")"$'\n'
          TEXT+="- <b>Workflow Run:</b> <a href=\"${RUN_URL}\">#${RUN_NUMBER}</a>"

          ARGS=(
            -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
            --retry 3
            -F "chat_id=${TELEGRAM_CHAT_ID}"
            --form-string "text=${TEXT}"
            -F "parse_mode=HTML"
            -F "disable_web_page_preview=true"
          )
          if [ -n "$TELEGRAM_TOPIC_ID" ]; then
            ARGS+=(-F "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi

          echo "Telegram response: $(curl "${ARGS[@]}")"
